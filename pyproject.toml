[project]
name = "rosapenna-backend"
version = "0.1.0"
description = "FastAPI service for Rosapenna tee time availability and booking automation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "playwright>=1.63.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18,<5",
    "reportlab>=5.1.0",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mongomock>=4.3,<5",
]
